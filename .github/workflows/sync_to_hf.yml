# Mirror main to the Hugging Face Space. Needs the HF_TOKEN repo secret (a write token).
# The Space id defaults to AdamSion74/immune-research; override with the HF_SPACE repo variable.
# Uses `hf upload` rather than `git push` because the Hub rejects binary files (model.npz, pca.pkl) sent with plain git.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'AdamSion74/immune-research' }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload to Space
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set; skipping the Space sync."
            exit 0
          fi
          pip install -q "huggingface_hub>=1.0"
          if ! python -c "import os, sys; from huggingface_hub import repo_exists; sys.exit(0 if repo_exists(os.environ['HF_SPACE'], repo_type='space') else 1)"; then
            echo "::warning::Space $HF_SPACE does not exist yet; create it (Gradio, ZeroGPU) and re-run this workflow."
            exit 0
          fi
          hf upload "$HF_SPACE" . . --repo-type space \
            --exclude ".git/*" --exclude ".github/*" \
            --delete "*" \
            --commit-message "Sync from GitHub ${GITHUB_SHA::7}"
